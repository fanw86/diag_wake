name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S . -A x64

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release 2>&1 | tee build/build.log
          exit ${PIPESTATUS[0]}

      - name: Print build log on failure
        if: failure()
        shell: bash
        run: cat build/build.log

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: diag_wake-windows-x64
          path: build/Release/diag_wake.exe
